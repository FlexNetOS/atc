[workspace]
resolver = "2"
members = [
    "crates/atc-core",
    "crates/atc-cli",
]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/harmony-labs/atc"
version = "0.1.0"

[workspace.dependencies]
# Async
async-trait = "0.1"
tokio = { version = "1.44", features = ["rt-multi-thread", "macros", "process", "io-util", "fs"] }
futures = "0.3"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Date/time
chrono = { version = "0.4.20", features = ["serde"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Serialization
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"

# SQLite
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }

# Temp files (for tests)
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = "s"
panic = "abort"
strip = true
