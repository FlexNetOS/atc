[workspace]
resolver = "2"
members = [
    "crates/atc-core",
    "crates/atc-cli",
]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/FlexNetOS/atc"
version = "0.1.9"

[workspace.dependencies]
# Async
async-trait = "0.1"
tokio = { version = "1.44", features = ["rt-multi-thread", "macros", "process", "io-util", "fs", "signal", "time"] }
futures = "0.3"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Date/time
chrono = { version = "0.4.20", features = ["serde"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Regex
regex = "1"

# Serialization
serde = { version = "1.0.210", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_yml = "0.0.12"
toml = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }

# Templating
handlebars = "6"

# SQLite
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }

# System
libc = "0.2"

# Color / terminal styling
owo-colors = "4"

# Human-friendly duration parsing (24h, 2d, 1w)
humantime = "2"

# Posix-shell-compatible argv splitting (for parsing user-configured pager commands)
shlex = "1.3"

# Temp files (for tests)
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = "s"
panic = "abort"
strip = true
