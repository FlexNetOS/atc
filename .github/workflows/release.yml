name: Release

on:
  push:
    tags: ['v*']
  repository_dispatch:
    types: [release-tagged]

concurrency:
  group: release-${{ github.event.client_payload.tag || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: atc

jobs:
  get-tag:
    name: Extract Tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Get tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            TAG="${{ github.event.client_payload.tag }}"
            if [ -z "$TAG" ]; then
              echo "::error::Missing client_payload.tag for repository_dispatch"
              exit 1
            fi
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  build-macos:
    name: Build macOS (${{ matrix.arch }})
    needs: [get-tag]
    runs-on: [self-hosted, macOS, ARM64]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
            asset: atc-darwin-arm64.tar.gz
          - arch: x64
            target: x86_64-apple-darwin
            asset: atc-darwin-x64.tar.gz
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p atc-cli

      - name: Package
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/release/${{ env.BINARY_NAME }} staging/
          cd staging
          tar czf ../${{ matrix.asset }} ${{ env.BINARY_NAME }}
          cd ..
          shasum -a 256 ${{ matrix.asset }} > ${{ matrix.asset }}.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256

  build-linux:
    name: Build Linux (${{ matrix.arch }})
    needs: [get-tag]
    runs-on: [self-hosted, macOS, ARM64]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-unknown-linux-gnu
            asset: atc-linux-arm64.tar.gz
            linker: aarch64-linux-gnu-gcc
          - arch: x64
            target: x86_64-unknown-linux-gnu
            asset: atc-linux-x64.tar.gz
            linker: x86_64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Verify cross-compiler
        run: |
          if ! command -v ${{ matrix.linker }} &>/dev/null; then
            echo "::error::Cross-compiler '${{ matrix.linker }}' not found. Install via: brew install messense/macos-cross-toolchains/${{ matrix.target }}"
            exit 1
          fi

      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: x86_64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }} -p atc-cli

      - name: Package
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/release/${{ env.BINARY_NAME }} staging/
          cd staging
          tar czf ../${{ matrix.asset }} ${{ env.BINARY_NAME }}
          cd ..
          shasum -a 256 ${{ matrix.asset }} > ${{ matrix.asset }}.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256

  release:
    name: Create Release
    needs: [get-tag, build-macos, build-linux]
    runs-on: [self-hosted, macOS, ARM64]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ needs.get-tag.outputs.tag }}
          files: |
            artifacts/atc-darwin-arm64.tar.gz
            artifacts/atc-darwin-arm64.tar.gz.sha256
            artifacts/atc-darwin-x64.tar.gz
            artifacts/atc-darwin-x64.tar.gz.sha256
            artifacts/atc-linux-arm64.tar.gz
            artifacts/atc-linux-arm64.tar.gz.sha256
            artifacts/atc-linux-x64.tar.gz
            artifacts/atc-linux-x64.tar.gz.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true

  notify-discord:
    name: Notify Discord
    needs: [get-tag, release]
    runs-on: ubuntu-latest
    # A failed Discord post must not block downstream consumers of the release
    # (e.g. the homebrew tap update).
    continue-on-error: true
    steps:
      - name: Check webhook configured
        id: check
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_RELEASES_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Discord webhook not configured, skipping notification"
          fi

      - name: Post to Discord
        if: steps.check.outputs.skip != 'true'
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_RELEASES_WEBHOOK_URL }}
        run: |
          TAG="${{ needs.get-tag.outputs.tag }}"

          PAYLOAD=$(jq -n \
            --arg title "ATC $TAG Released" \
            --arg desc "A new version of ATC, the headless agent orchestrator, is available." \
            --arg install_brew 'brew install FlexNetOS/tap/atc' \
            --arg url "https://github.com/FlexNetOS/atc/releases/tag/$TAG" \
            '{
              embeds: [{
                title: $title,
                url: $url,
                description: $desc,
                color: 3066993,
                fields: [
                  {
                    name: "Install via Homebrew",
                    value: ("```sh\n" + $install_brew + "\n```")
                  }
                ]
              }]
            }')

          # Bound the request: connect timeout 10s, total time 30s, up to 3
          # retries (with backoff) for transient network failures. `set +e`
          # lets us capture curl's exit code separately from HTTP_STATUS so
          # pre-HTTP failures (DNS, connection refused, timeout) are logged
          # distinctly from HTTP-level failures.
          set +e
          HTTP_STATUS=$(curl -sS -o /tmp/discord_response.txt -w "%{http_code}" \
            --connect-timeout 10 \
            --max-time 30 \
            --retry 3 \
            --retry-delay 2 \
            --retry-all-errors \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$WEBHOOK_URL")
          CURL_EXIT=$?
          set -e

          if [ "$CURL_EXIT" -ne 0 ]; then
            echo "::warning::Discord notification request failed before HTTP response (curl exit $CURL_EXIT)"
            cat /tmp/discord_response.txt 2>/dev/null || true
            exit 1
          elif [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Discord notification sent successfully (HTTP $HTTP_STATUS)"
          else
            echo "::warning::Discord notification failed (HTTP $HTTP_STATUS)"
            cat /tmp/discord_response.txt
            exit 1
          fi

  update-homebrew:
    name: Update Homebrew Formula
    needs: [get-tag, release]
    runs-on: [self-hosted, macOS, ARM64]
    permissions:
      contents: read
      actions: read
    steps:
      - name: Reset job workspace
        run: rm -rf "$PWD/artifacts" "$PWD/tap" "$PWD/src-repo"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: src-repo
          sparse-checkout: homebrew

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Extract version
        id: version
        run: |
          echo "version=${{ needs.get-tag.outputs.version }}" >> $GITHUB_OUTPUT

      - name: Read checksums
        id: checksums
        run: |
          echo "darwin_arm64=$(awk '{print $1}' artifacts/atc-darwin-arm64.tar.gz.sha256)" >> $GITHUB_OUTPUT
          echo "darwin_x64=$(awk '{print $1}' artifacts/atc-darwin-x64.tar.gz.sha256)" >> $GITHUB_OUTPUT
          echo "linux_arm64=$(awk '{print $1}' artifacts/atc-linux-arm64.tar.gz.sha256)" >> $GITHUB_OUTPUT
          echo "linux_x64=$(awk '{print $1}' artifacts/atc-linux-x64.tar.gz.sha256)" >> $GITHUB_OUTPUT

      - name: Update Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          gh auth setup-git --hostname github.com

          gh repo clone FlexNetOS/homebrew-tap tap
          cd tap

          VERSION="${{ steps.version.outputs.version }}"
          DARWIN_ARM64="${{ steps.checksums.outputs.darwin_arm64 }}"
          DARWIN_X64="${{ steps.checksums.outputs.darwin_x64 }}"
          LINUX_ARM64="${{ steps.checksums.outputs.linux_arm64 }}"
          LINUX_X64="${{ steps.checksums.outputs.linux_x64 }}"

          # Checkout or create release branch BEFORE modifying files
          BRANCH="atc-v${VERSION}"
          branch_exists=false
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            branch_exists=true
            git fetch origin "$BRANCH:$BRANCH"
            git checkout "$BRANCH"
          else
            git checkout -b "$BRANCH"
          fi

          # Copy template from source repo (single source of truth)
          cp "$GITHUB_WORKSPACE/src-repo/homebrew/atc.rb" Formula/atc.rb

          # Strip the reference-template comment header (lines starting with #)
          sed -i '' '/^# /d' Formula/atc.rb

          # Substitute placeholders with actual values
          sed -i '' "s/VERSION_PLACEHOLDER/${VERSION}/g" Formula/atc.rb
          sed -i '' "s/DARWIN_ARM64_PLACEHOLDER/${DARWIN_ARM64}/" Formula/atc.rb
          sed -i '' "s/DARWIN_X64_PLACEHOLDER/${DARWIN_X64}/" Formula/atc.rb
          sed -i '' "s/LINUX_ARM64_PLACEHOLDER/${LINUX_ARM64}/" Formula/atc.rb
          sed -i '' "s/LINUX_X64_PLACEHOLDER/${LINUX_X64}/" Formula/atc.rb

          git add Formula/atc.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            if [ "$branch_exists" = false ]; then
              echo "Formula already up to date on main; nothing to do."
              exit 0
            fi
            echo "No new tap changes; reusing existing branch."
          else
            git commit -m "atc ${VERSION}"
            git push -u origin "$BRANCH"
          fi

          # Create PR (may already exist from a previous run)
          pr_url=""
          pr_output=$(gh pr create \
            --title "atc ${VERSION}" \
            --body "Automated formula update for atc v${VERSION}" \
            --base main \
            --head "$BRANCH" 2>&1) && {
            pr_url=$(echo "$pr_output" | grep -o 'https://github.com/[^ ]*')
          } || {
            if echo "$pr_output" | grep -qi "already exists"; then
              echo "::notice::PR already exists for $BRANCH — continuing"
              pr_url=$(gh pr view "$BRANCH" --json url --jq '.url')
            else
              echo "::error::PR creation failed: $pr_output"
              exit 1
            fi
          }

          # Auto-merge if we have permission
          if [ -n "$pr_url" ]; then
            if ! gh pr merge "$pr_url" --auto --squash 2>&1; then
              echo "::warning::Auto-merge request failed — manual merge may be required"
            fi
          else
            echo "::warning::Could not determine PR URL — skipping auto-merge"
          fi
