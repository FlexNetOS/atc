name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-progress runs when a new commit is pushed to the same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  ci:
    name: CI
    # Trust-boundary routing: fork PRs land on ubuntu-latest (free, public-repo
    # standard runners). Internal PRs, main pushes, and any other event run on
    # our self-hosted Mac Studio. The self-hosted runner is never *requested*
    # for fork code — not just guarded against. See [[tasks/harmony-467]].
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON('["self-hosted", "macOS", "ARM64"]') }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      # tmux is a runtime dependency of the test suite (atc shells out to it).
      - name: Install tmux (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Install tmux (macOS)
        if: runner.os == 'macOS'
        run: |
          if ! command -v tmux &> /dev/null; then
            brew install tmux
          fi
          tmux -V

      # Caching diverges by platform: sccache (mac) vs. Swatinem/rust-cache
      # (linux). Don't try to unify — install paths and conventions differ
      # enough that a single composite would be more drift than two branches.
      - name: Configure sccache (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_CACHE_SIZE=10G" >> "$GITHUB_ENV"

      - name: Setup sccache (macOS)
        if: runner.os == 'macOS'
        uses: ./.github/actions/setup-sccache

      - name: Cache cargo registry (macOS)
        if: runner.os == 'macOS'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-

      - name: Rust cache (Linux)
        if: runner.os == 'Linux'
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      # Identical check sequence on both runners — drift surface is only the
      # install/cache prelude above. Same step list, same job topology.
      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets

      - name: Build
        run: cargo build --all-targets

      - name: Install nextest
        uses: taiki-e/install-action@cf525cb33f51aca27cd6fa02034117ab963ff9f1 # v2.75.22
        with:
          tool: cargo-nextest

      - name: Test
        run: cargo nextest run --profile ci

      - name: sccache stats (macOS)
        if: always() && runner.os == 'macOS'
        run: sccache --show-stats || true
