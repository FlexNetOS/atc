name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Default to read-only for the GITHUB_TOKEN. No job in this workflow needs
# write scopes, and fork PRs run untrusted code on ubuntu-latest — explicit
# least-privilege keeps the token harmless if a step is ever compromised.
permissions:
  contents: read

# Cancel in-progress runs when a new commit is pushed to the same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  ci:
    name: CI
    # Cap wall time so a hung step can't hold the self-hosted Mac runner
    # indefinitely. 45m comfortably covers a cold cache build + full test
    # suite; healthy runs land well under it.
    timeout-minutes: 45
    # FlexNetOS fork: no self-hosted macOS ARM64 runner is registered in this
    # org, so the upstream trust-boundary routing (fork PRs → ubuntu, internal →
    # self-hosted Mac Studio; see [[tasks/harmony-467]]) left same-repo PRs
    # queued forever. Everything runs on GitHub-hosted ubuntu here; the job's
    # Linux paths (tmux install etc.) already exist.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      # tmux is a runtime dependency of the test suite (atc shells out to it).
      - name: Install tmux (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Install tmux (macOS)
        if: runner.os == 'macOS'
        run: |
          if ! command -v tmux &> /dev/null; then
            brew install tmux
          fi
          tmux -V

      # Caching diverges by platform: sccache (mac) vs. Swatinem/rust-cache
      # (linux). Don't try to unify — install paths and conventions differ
      # enough that a single composite would be more drift than two branches.
      - name: Configure sccache (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_CACHE_SIZE=10G" >> "$GITHUB_ENV"

      - name: Setup sccache (macOS)
        if: runner.os == 'macOS'
        uses: ./.github/actions/setup-sccache

      - name: Cache cargo registry (macOS)
        if: runner.os == 'macOS'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-

      - name: Rust cache (Linux)
        if: runner.os == 'Linux'
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      # Identical check sequence on both runners — drift surface is only the
      # install/cache prelude above. Same step list, same job topology.
      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets

      - name: Build
        run: cargo build --all-targets

      - name: Install nextest
        uses: taiki-e/install-action@cf525cb33f51aca27cd6fa02034117ab963ff9f1 # v2.75.22
        with:
          tool: cargo-nextest

      - name: Test
        run: cargo nextest run --profile ci

      - name: sccache stats (macOS)
        if: always() && runner.os == 'macOS'
        run: sccache --show-stats || true
